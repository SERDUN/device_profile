name: device_profile
description: "What the device is: the name a person knows it by (Redmi 9A, Galaxy XCover 5, iPhone 12 mini) instead of its hardware code, the kind of device, and whether its display is round."
version: 0.1.0
homepage: https://github.com/SERDUN/device_profile
repository: https://github.com/SERDUN/device_profile
issue_tracker: https://github.com/SERDUN/device_profile/issues
topics:
  - device
  - device-info
  - android
  - ios
  - wear-os

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.serdun.device_profile
        pluginClass: DeviceProfilePlugin
      ios:
        pluginClass: DeviceProfilePlugin
